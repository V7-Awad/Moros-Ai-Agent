services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_PLAYWRIGHT_BROWSERS: ${INSTALL_PLAYWRIGHT_BROWSERS:-false}
    image: moros-ai:latest
    command: ["python", "dashboard.py", "--host", "0.0.0.0", "--port", "8080", "--no-open"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./targets:/app/targets
    env_file:
      - path: .env
        required: false
    environment:
      - MOROS_DASHBOARD_TOKEN=${MOROS_DASHBOARD_TOKEN:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    init: true
    restart: unless-stopped

  scanner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_PLAYWRIGHT_BROWSERS: ${INSTALL_PLAYWRIGHT_BROWSERS:-false}
    image: moros-ai:latest
    profiles:
      - cli
    command: ["python", "run.py", "--help"]
    volumes:
      - ./targets:/app/targets
    env_file:
      - path: .env
        required: false
    init: true
