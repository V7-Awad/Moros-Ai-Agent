name: Moros Retest Verification (Example)

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      target:
        description: "Authorized target domain (must match repository MOROS_AUTHORIZED_TARGET variable)"
        required: true
      finding_id:
        description: "Optional finding ID to retest"
        required: false
        default: ""

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  retest-verification:
    name: Retest Remediated Findings
    runs-on: ubuntu-latest
    # Explicit scope guard: refuse active retests on untrusted fork PRs.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Moros dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate authorized scope for retest
        id: scope_guard
        env:
          AUTHORIZED_TARGET: ${{ vars.MOROS_AUTHORIZED_TARGET }}
          DISPATCH_TARGET: ${{ github.event.inputs.target }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "$AUTHORIZED_TARGET" ]; then
            echo "Refusing retest: repository variable MOROS_AUTHORIZED_TARGET is not configured."
            exit 3
          fi
          target="$AUTHORIZED_TARGET"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$DISPATCH_TARGET" ]; then
            if [ "$DISPATCH_TARGET" != "$AUTHORIZED_TARGET" ]; then
              echo "Refusing retest: untrusted target input does not match MOROS_AUTHORIZED_TARGET."
              exit 3
            fi
          fi
          python tools/ci_gate.py \
            --check-scope \
            --target "$target" \
            --target-dir "targets/$target" \
            --scan-mode "quick"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Execute deterministic retest verification
        id: retest
        env:
          TARGET: ${{ steps.scope_guard.outputs.target }}
          FINDING_ID: ${{ github.event.inputs.finding_id }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          if [ -f "tools/retest_engine.py" ]; then
            retest_args=(--target "$TARGET")
            if [ -n "$FINDING_ID" ]; then
              retest_args+=(--finding-id "$FINDING_ID")
            fi
            python tools/retest_engine.py "${retest_args[@]}"
          else
            python run.py \
              --target "$TARGET" \
              --scan-mode quick \
              --max-http-requests 40 \
              --https-only \
              --no-trace \
              --quiet
          fi
          echo "retest-rc=$?" >> "$GITHUB_OUTPUT"

      - name: Evaluate retest regression gate and build PR summary
        id: gate
        env:
          TARGET: ${{ steps.scope_guard.outputs.target }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          python tools/ci_gate.py \
            --output-dir "targets/$TARGET/output" \
            --target "$TARGET" \
            --min-severity medium \
            --fail-on-confirmed true \
            --fail-on-candidate false \
            --require-validation true \
            --report-url "$RUN_URL" \
            --summary-out /tmp/moros-retest-summary.md \
            --json-out /tmp/moros-retest-gate.json > /dev/null
          gate_rc=$?
          echo "exit-code=$gate_rc" >> "$GITHUB_OUTPUT"
          if [ -f "targets/$TARGET/output/report/findings.sarif" ]; then
            echo "sarif-path=targets/$TARGET/output/report/findings.sarif" >> "$GITHUB_OUTPUT"
          else
            echo "sarif-path=" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/moros-retest-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$gate_rc"

      - name: Upload retest SARIF 2.1.0
        if: ${{ always() && steps.gate.outputs.sarif-path != '' }}
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          sarif_file: ${{ steps.gate.outputs.sarif-path }}
          category: moros-retest-${{ steps.scope_guard.outputs.target }}

      - name: Post redacted retest summary on PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f /tmp/moros-retest-summary.md ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/moros-retest-summary.md
          fi
